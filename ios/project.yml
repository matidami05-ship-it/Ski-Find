name: SkiFind
options:
  bundleIdPrefix: com.skistudio
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    DEVELOPMENT_TEAM: ""
targets:
  SkiFind:
    type: application
    platform: iOS
    sources:
      - path: SkiFind
    info:
      path: SkiFind/Info.plist
      properties:
        CFBundleDisplayName: Ski Find
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        NSLocationWhenInUseUsageDescription: Ski Find shares your location with the people you paired with, and shows how far away they are.
        NSLocationAlwaysAndWhenInUseUsageDescription: Ski Find keeps sharing your location with the people you paired with while the app is closed, so they can always see where you are. You can pause sharing anytime in Settings.
        UIBackgroundModes: [location, fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.skistudio.find.refresh]
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        LSApplicationQueriesSchemes: [maps]
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.skistudio.find
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme: {}
