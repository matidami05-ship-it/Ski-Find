name: Android APK

on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew --no-daemon assembleRelease 2>&1 | tee build.log || {
            # Surface compiler errors as annotations so they show on the run summary.
            grep -E "^e: |error:|FAILED|What went wrong|Exception" -A3 build.log | head -60 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk ../SkiFind.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SkiFind-apk
          path: SkiFind.apk

      # Puts the APK on the repo's Releases page so it can be downloaded straight to her phone.
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "android-${{ github.run_number }}" ../SkiFind.apk \
            --title "Ski Find for Android, build ${{ github.run_number }}" \
            --notes "On the Samsung, download SkiFind.apk and open it to install." \
            --latest
